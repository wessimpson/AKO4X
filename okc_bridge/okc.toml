# okc broker settings. Parent-side: a child env never sees this file, so a sub can't raise its own caps.

[schedule]
# Official evaluations follow check, check, run, check, check, run, ... per problem per UTC day:
# the next one is a scored run once today's checks reach checks_per_run x (scored runs + 1).
# 2 gives 20 checks + 10 runs = the full 30 a day.
checks_per_run = 2
# Never spend the last N of each kind (keep some for manual work). 0 = use everything.
reserve_checks = 0
reserve_runs = 0
# Official evaluations open only in the last N hours before each 00:00 UTC reset (one burst;
# the local H200 the rest of the day). Unset = any time.
official_window_h = 6

[round]
# Official evaluations one child env (one round) may spend. 12 = four check/check/run cycles: with
# official_window_h the day's slots are spent in a few rounds inside the window.
max_evals = 12

[rate]
# okc allows 6 submissions a minute per token and 10 per account; keep well under.
min_spacing_s = 12

[track]
# Kernel submissions close Nov 4 at 11:59 pm PT.
closes = "2026-11-04T23:59:00-08:00"

[sidecar]
# Local evaluations (scripts/local_bench.sh) on an H200 SXM RunPod pod running sidecar/, a copy of the
# judge (okc_bridge/local.py, okc_bridge/pod_guard.py). Free of okc slots; costs RunPod credit.
enabled = true
repo = "~/meta-muse-challenge/.claude/worktrees/agent-abba127221bf9392b"
# The guard stops the pod for good once its counted GPU spend reaches this (the account holds $250).
budget_usd = 225.0
# The authority: stop the pod for good when the RunPod account's real balance falls to this.
min_balance_usd = 25.0
# Stop the pod after this many minutes with no local bench running or asked for.
idle_stop_min = 60
